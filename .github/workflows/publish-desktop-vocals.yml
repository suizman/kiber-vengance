name: Publish verified desktop vocal packages
on:
  workflow_run:
    workflows: [Desktop vocal companion]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop vocal companion workflow run
        required: true
      engine_source:
        description: Exact source commit of that build
        required: true
      release_tag:
        description: Version tag to publish after verifying the successful build
        required: true
permissions:
  actions: read
  contents: write
jobs:
  attach:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'desktop-vocals-v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify build and publish checksum-verified versioned packages
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          ENGINE_SOURCE: ${{ inputs.engine_source || github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const {execFileSync} = require('node:child_process');
            const repo = context.repo;
            const run_id = Number(process.env.BUILD_RUN_ID);
            const tag = process.env.RELEASE_TAG;
            const expected = process.env.ENGINE_SOURCE;
            if (!Number.isSafeInteger(run_id) || !/^desktop-vocals-v\d+\.\d+\.\d+$/.test(tag) || !/^[a-f0-9]{40}$/.test(expected)) throw Error('Invalid release inputs');
            const {data:run} = await github.rest.actions.getWorkflowRun({...repo,run_id});
            if (run.name !== 'Desktop vocal companion' || run.conclusion !== 'success' || run.head_sha !== expected) throw Error('Build has not passed for the requested source');
            const {data:ref} = await github.rest.git.getRef({...repo,ref:'tags/'+tag});
            const tagCommit = ref.object.type === 'tag'
              ? (await github.rest.git.getTag({...repo,tag_sha:ref.object.sha})).data.object.sha
              : ref.object.sha;
            if (tagCommit !== expected) throw Error('Release tag does not identify the verified build');
            const {data:versionFile} = await github.rest.repos.getContent({...repo,path:'companion/kv_companion/__init__.py',ref:expected});
            const version = Buffer.from(versionFile.content,'base64').toString('utf8').match(/^VERSION = "([0-9.]+)"$/m)?.[1];
            if (tag !== 'desktop-vocals-v'+version) throw Error('Tag and package version differ');
            const {data:studioFile} = await github.rest.repos.getContent({...repo,path:'package.json',ref:expected});
            const studioVersion = JSON.parse(Buffer.from(studioFile.content,'base64').toString('utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(studioVersion)) throw Error('Invalid studio version');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...repo,tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (!release) release = (await github.rest.repos.createRelease({...repo,tag_name:tag,target_commitish:expected,name:'КИБЕР VENGANCE Studio '+studioVersion+' · Companion '+version,draft:true,body:[
              'Studio '+studioVersion+': voice generation is desktop-only, with no phone/tablet entrypoints or voice model/worker downloads. The concise English READMEs link a bilingual feature manual in docs/wiki: 13 English pages and 13 Spanish counterparts, English by default, with shared real English UI images.',
              'Native vocal companion for macOS Apple Silicon and Intel, Windows x64 and Linux x86_64 (Arch/Ubuntu AppImage).',
              'DiffSinger CoreML fix: dynamic-length vocoding runs on CPU while the acoustic stage retains its selected provider. Restart the previous companion process after installing the update; models and generated audio are preserved.',
              'Intel: DiffSinger CPU with ONNX Runtime 1.23.2. ACE-Step is unavailable on Intel because its pinned PyTorch has no macOS x86_64 wheel.',
              'Models are separate opt-in downloads. macOS is ad-hoc signed, without Developer ID/notarization; Windows has no publisher certificate.',
              'All four native packages passed bundled-runtime checks. macOS DMGs were mounted and signatures verified; Windows installer was installed/tested/uninstalled. These checks do not establish model inference or listening quality on Intel.',
              'Every package includes a SHA-256 sidecar. Downloads require access to this private repository.',
              'Source: '+expected+' · Build: '+run.html_url
            ].join('\n\n')})).data;
            if (release.target_commitish !== expected) throw Error('Release source differs');
            const release_id = release.id;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...repo,run_id});
            const names = ['companion-linux-x64','companion-macos-arm64','companion-macos-x64','companion-windows-x64'];
            const uploaded = await github.paginate(github.rest.repos.listReleaseAssets,{...repo,release_id});
            for (const name of names) {
              const artifact = artifacts.find(a=>a.name===name&&!a.expired);
              if (!artifact) throw Error('Missing package: '+name);
              const {data} = await github.rest.actions.downloadArtifact({...repo,artifact_id:artifact.id,archive_format:'zip'});
              const folder = path.join(process.env.RUNNER_TEMP,name);
              fs.mkdirSync(folder,{recursive:true});
              const zip = folder+'.zip';fs.writeFileSync(zip,Buffer.from(data));
              execFileSync('unzip',['-q',zip,'-d',folder]);
              const files = fs.readdirSync(folder);
              const checksum = files.find(f=>f.endsWith('.sha256'));
              if (files.length!==2 || !checksum) throw Error('Unexpected package contents');
              const binary = checksum.slice(0,-7);
              const bytes = fs.readFileSync(path.join(folder,binary));
              const sha = crypto.createHash('sha256').update(bytes).digest('hex');
              if (fs.readFileSync(path.join(folder,checksum),'utf8').trim()!==sha+'  '+binary) throw Error('Package checksum mismatch');
              for (const filename of [binary,checksum]) {
                const content = fs.readFileSync(path.join(folder,filename));
                const existing = uploaded.find(a=>a.name===filename);
                if (existing) {
                  const {data:old} = await github.rest.repos.getReleaseAsset({...repo,asset_id:existing.id,headers:{accept:'application/octet-stream'}});
                  if (crypto.createHash('sha256').update(Buffer.from(old)).digest('hex')!==crypto.createHash('sha256').update(content).digest('hex')) throw Error('Existing asset differs; refusing to replace it');
                  continue;
                }
                await github.rest.repos.uploadReleaseAsset({...repo,release_id,name:filename,data:content,headers:{'content-type':'application/octet-stream','content-length':content.length}});
                core.info('Attached '+filename+' (SHA-256 verified)');
              }
            }
            if (release.draft) await github.rest.repos.updateRelease({...repo,release_id,draft:false,make_latest:'true'});
            core.info('Published '+tag+' with all four checksum-verified packages.');
