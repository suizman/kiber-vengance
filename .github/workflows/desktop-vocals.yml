name: Desktop vocal companion
on:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/desktop-vocals.yml'
    tags:
      - 'desktop-vocals-v*'
    branches:
      - master
      - desktop-vocals-release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Companion unit and loopback integration tests
        run: python -m unittest discover -s companion/tests -v
      - name: Build native package and run bundled-runtime self-test
        run: python companion/packaging/build.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.platform }}
          path: companion/out/*
          if-no-files-found: error
          retention-days: 14
